# Daftar target pelacak harga.
#
# Aturan pengisian:
#   slug      : id unik, huruf kecil, dipakai sebagai nama berkas. JANGAN diubah
#               setelah dipakai — mengubahnya memutus riwayat arsip.
#   name      : nama tampilan
#   vendor    : perusahaan pemilik
#   category  : ai-coding | ai-assistant | ai-api | ai-media | dev-infra |
#               database | productivity | automation | observability |
#               gpu-rental
#   url       : halaman harga PUBLIK. Tidak boleh di balik login/paywall.
#   render    : static (default) | js  -> "js" hanya kalau harga benar-benar
#               tidak muncul di HTML awal.
#   currency  : mata uang utama yang ditampilkan halaman (perkiraan awal)
#   enabled   : false untuk menonaktifkan sementara tanpa menghapus riwayat
#   notes     : catatan bebas (mis. alasan dinonaktifkan)
#
# Sebelum menambah target baru, jalankan:  python -m scripts.check_targets

defaults:
  render: static
  currency: USD
  enabled: true

