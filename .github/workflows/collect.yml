name: collect

# Arsipnya hidup dari konsistensi. Setiap hari yang lewat tanpa mengumpulkan
# adalah hari yang hilang permanen — jadi workflow ini sengaja dibuat supaya
# TIDAK pernah gagal total gara-gara sebagian situs error.

on:
  schedule:
    # Dokumentasi GitHub: event `schedule` tertunda saat beban tinggi, dan
    # "waktu beban tinggi termasuk awal setiap jam". Jadwal 02:10 UTC pernah
    # dilewatkan total pada 28/08/2026 — masih terlalu dekat puncak jam.
    # Karena itu menitnya ganjil dan jauh dari angka bulat.
    - cron: "43 2 * * *"   # 09:43 WIB
    # Cadangan sore: kalau yang pagi dilewatkan GitHub, yang ini menangkapnya
    # supaya harinya tidak hilang. Kalau yang pagi sudah berhasil, penjaga
    # sekali-per-hari membuat run ini berhenti dalam hitungan detik.
    - cron: "17 7 * * *"   # 14:17 WIB
    # Jaring ketiga dan keempat, ditambahkan 29/09/2026 setelah slot pagi
    # DILEWATKAN GitHub dua hari berturut-turut (28/09 dan 29/09). Pada 28/09
    # harinya diselamatkan slot 07:17 yang sendirinya baru jalan pukul 08:57
    # UTC. Dengan dua slot saja, satu kali GitHub sibuk di dua slot itu =
    # satu hari arsip hilang permanen.
    #
    # Biayanya hampir nol: kalau hari itu sudah berhasil, penjaga
    # sekali-per-hari membuat run berhenti dalam ~40 detik, dan repo publik
    # tidak dikenai kuota menit GitHub Actions. Tidak ada permintaan tambahan
    # ke situs vendor — penjaga yang sama mencegahnya.
    - cron: "29 11 * * *"  # 18:29 WIB
    - cron: "53 15 * * *"  # 22:53 WIB
  workflow_dispatch:
    inputs:
      only:
        description: "Slug tertentu, dipisah koma (kosong = semua)"
        required: false
      force:
        description: "Abaikan penjaga sekali-per-hari"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Versi aksi WAJIB yang berjalan di Node 24. GitHub mengumumkan Node 20
      # dihapus dari runner pada 23/09/2026 (changelog 2025-09-19). checkout@v4,
      # setup-python@v5, dan cache@v4 masih Node 20 — kalau dibiarkan, run
      # harian bisa gagal total dan hari yang hilang tidak bisa dikejar.
      # Isian (fetch-depth, python-version, cache, path, key) tidak berubah.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Sebagian halaman harga hanya memuat angkanya lewat JavaScript.
      # Target tersebut ditandai `render: js` di targets.yaml. Kalau langkah
      # ini dihapus, target itu dilewati dengan status skipped_render —
      # tidak menjatuhkan run, tapi arsipnya bolong.
      - name: Cache browser Playwright
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.62.0

      - name: Pasang Chromium untuk target render=js
        run: |
          pip install playwright==1.62.0
          python -m playwright install --with-deps chromium

      # Penjaga sekali-per-hari membaca data/runs/<hari-ini>.json dari pohon
      # kerja. Tapi `actions/checkout` pada event `schedule` mengambil commit
      # SAAT RUN DIANTREKAN, bukan saat run mulai.
      #
      # 17/11/2026: slot 09:43 tertunda ~5 jam oleh GitHub dan baru berjalan
      # berdekatan dengan slot 14:17. Run pertama selesai 07:34 UTC dan
      # menyimpan arsipnya; run kedua (yang sudah diantrekan sebelumnya)
      # mulai sesudahnya, tapi checkout-nya masih commit LAMA — tanpa catatan
      # run hari itu. Penjaganya melihat "belum ada yang diambil hari ini" dan
      # mengambil ULANG ke-132 halaman. Setiap vendor menerima DUA permintaan
      # hari itu, padahal halaman publik kita berjanji "one request per page
      # per day, never more".
      #
      # Diukur ke seluruh riwayat git: dari 12 hari yang punya lebih dari satu
      # snapshot, hanya 17/11 yang benar-benar mengambil ganda — sebelas hari
      # lainnya run kedua hanya mengulang target yang gagal, persis yang
      # dirancang. Jadi ini lubang balapan yang jarang, tapi menyentuh janji
      # publik.
      #
      # Skrip cadangan scripts/run_anywhere.sh SUDAH melakukan ini sejak awal
      # ("menarik arsip terbaru SEBELUM mengambil") — hanya jalur utamanya
      # yang belum. Dengan `concurrency: collect` di atas, run tidak pernah
      # berjalan bersamaan, jadi menyamakan pohon kerja dengan main tepat
      # sebelum mengambil menutup celahnya.
      #
      # Kalau penarikan gagal (jaringan GitHub sesaat), run TETAP berlanjut
      # dengan peringatan keras: kehilangan satu hari arsip lebih mahal
      # daripada satu kali pengambilan ganda, dan perilakunya tidak lebih
      # buruk daripada sebelum langkah ini ada.
      - name: Tarik arsip terbaru sebelum mengambil
        run: |
          cabang="${GITHUB_REF_NAME:-main}"
          if git fetch --quiet origin "$cabang" && git merge --ff-only "origin/$cabang"; then
            echo "Pohon kerja = origin/$cabang ($(git rev-parse --short HEAD))."
          else
            echo "::warning::Gagal menarik arsip terbaru — penjaga sekali-per-hari bisa membaca catatan lama. Run tetap dilanjutkan supaya hari ini tidak hilang."
          fi

      - name: Jalankan pengumpul
        env:
          APT_CONTACT_URL: https://github.com/${{ github.repository }}
        run: |
          python -m collector.run \
            ${{ github.event.inputs.only && format('--only {0}', github.event.inputs.only) || '' }} \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      # Ringkasan hanya menyusun PESAN commit. Ia tidak boleh bisa menggagalkan
      # penyimpanan arsip: tanpa continue-on-error, satu galat di sini membuat
      # langkah "Commit snapshot" dilewati dan seluruh hari itu hilang.
      # Kalau pesannya kosong, push_snapshot.py memakai pesan cadangan.
      - name: Ringkas hasil
        id: sum
        continue-on-error: true
        run: python scripts/summarize_run.py >> "$GITHUB_OUTPUT"

      - name: Commit snapshot
        run: python scripts/push_snapshot.py "${{ steps.sum.outputs.message }}"

      # Status mesin-terbaca untuk pemantau luar (scheduled task mingguan yang
      # memeriksa apakah arsip masih hidup). Sebelumnya pemantau itu membaca
      # halaman Actions GitHub yang dirender JavaScript; halamannya kembali
      # kosong dan isian kosong itu dibaca sebagai "koleksi berhenti" —
      # alarm palsu 03/11/2026. Satu berkas JSON tidak bisa salah dibaca
      # seperti itu.
      #
      # Letaknya SETELAH "Commit snapshot" supaya git log sudah memuat commit
      # hari ini, dan SEBELUM build_site.py supaya ikut terbawa
      # `git add -A docs/` — tidak perlu commit sendiri.
      #
      # continue-on-error mengikuti aturan yang sama dengan langkah di
      # bawahnya: penulis status tidak boleh bisa membuat satu hari arsip
      # hilang. Berkasnya juga sengaja tidak memuat jam dinding, supaya
      # docs/ tidak berubah tanpa alasan dan `git diff` tetap bermakna.
      - name: Tulis status.json
        if: always()
        continue-on-error: true
        run: python scripts/write_status.py --out docs/status.json

      # ---------------------------------------------------------------------
      # Halaman publik. SENGAJA diletakkan SETELAH arsip aman tersimpan, dan
      # SENGAJA memakai continue-on-error: kalau pembangun halaman rusak, itu
      # tidak boleh sampai membuat satu hari arsip hilang. Arsip adalah aset
      # proyek ini; halaman publik hanyalah tampilannya.
      #
      # Skrip ini tidak pernah mengambil apa pun dari internet dan tidak
      # pernah menulis ke data/ — hanya membaca arsip lalu menulis docs/.
      # ---------------------------------------------------------------------
      - name: Bangun & terbitkan halaman publik
        if: always()
        continue-on-error: true
        run: python scripts/build_site.py --commit

      - name: Tulis ringkasan ke halaman run
        if: always()
        run: python scripts/summarize_run.py --markdown >> "$GITHUB_STEP_SUMMARY"
