name: collect

# Arsipnya hidup dari konsistensi. Setiap hari yang lewat tanpa mengumpulkan
# adalah hari yang hilang permanen — jadi workflow ini sengaja dibuat supaya
# TIDAK pernah gagal total gara-gara sebagian situs error.

on:
  schedule:
    # Dokumentasi GitHub: event `schedule` tertunda saat beban tinggi, dan
    # "waktu beban tinggi termasuk awal setiap jam". Jadwal 02:10 UTC pernah
    # dilewatkan total pada 28/08/2026 — masih terlalu dekat puncak jam.
    # Karena itu menitnya ganjil dan jauh dari angka bulat.
    - cron: "43 2 * * *"   # 09:43 WIB
    # Cadangan sore: kalau yang pagi dilewatkan GitHub, yang ini menangkapnya
    # supaya harinya tidak hilang. Kalau yang pagi sudah berhasil, penjaga
    # sekali-per-hari membuat run ini berhenti dalam hitungan detik.
    - cron: "17 7 * * *"   # 14:17 WIB
  workflow_dispatch:
    inputs:
      only:
        description: "Slug tertentu, dipisah koma (kosong = semua)"
        required: false
      force:
        description: "Abaikan penjaga sekali-per-hari"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Sebagian halaman harga hanya memuat angkanya lewat JavaScript.
      # Target tersebut ditandai `render: js` di targets.yaml. Kalau langkah
      # ini dihapus, target itu dilewati dengan status skipped_render —
      # tidak menjatuhkan run, tapi arsipnya bolong.
      - name: Cache browser Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.62.0

      - name: Pasang Chromium untuk target render=js
        run: |
          pip install playwright==1.62.0
          python -m playwright install --with-deps chromium

      - name: Jalankan pengumpul
        env:
          APT_CONTACT_URL: https://github.com/${{ github.repository }}
        run: |
          python -m collector.run \
            ${{ github.event.inputs.only && format('--only {0}', github.event.inputs.only) || '' }} \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Ringkas hasil
        id: sum
        run: python scripts/summarize_run.py >> "$GITHUB_OUTPUT"

      - name: Commit snapshot
        run: python scripts/push_snapshot.py "${{ steps.sum.outputs.message }}"

      - name: Tulis ringkasan ke halaman run
        if: always()
        run: python scripts/summarize_run.py --markdown >> "$GITHUB_STEP_SUMMARY"
