name: validate-targets

# Jalankan MANUAL sebelum menambah target baru ke produksi.
# Ini satu-satunya tempat daftar target diuji terhadap situs sungguhan:
# hasilnya muncul di ringkasan run, tidak ada yang ditulis ke data/.

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Slug tertentu, dipisah koma (kosong = semua)"
        required: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Periksa target
        env:
          APT_CONTACT_URL: https://github.com/${{ github.repository }}
        run: |
          {
            echo '## Hasil validasi target'
            echo
            echo '```'
            python -m scripts.check_targets \
              ${{ github.event.inputs.only && format('--only {0}', github.event.inputs.only) || '' }}
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
