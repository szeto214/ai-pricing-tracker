name: collect

# Arsipnya hidup dari konsistensi. Setiap hari yang lewat tanpa mengumpulkan
# adalah hari yang hilang permanen — jadi workflow ini sengaja dibuat supaya
# TIDAK pernah gagal total gara-gara sebagian situs error.

on:
  schedule:
    # Dokumentasi GitHub: event `schedule` tertunda saat beban tinggi, dan
    # "waktu beban tinggi termasuk awal setiap jam". Jadwal 02:10 UTC pernah
    # dilewatkan total pada 28/08/2026 — masih terlalu dekat puncak jam.
    # Karena itu menitnya ganjil dan jauh dari angka bulat.
    - cron: "43 2 * * *"   # 09:43 WIB
    # Cadangan sore: kalau yang pagi dilewatkan GitHub, yang ini menangkapnya
    # supaya harinya tidak hilang. Kalau yang pagi sudah berhasil, penjaga
    # sekali-per-hari membuat run ini berhenti dalam hitungan detik.
    - cron: "17 7 * * *"   # 14:17 WIB
  workflow_dispatch:
    inputs:
      only:
        description: "Slug tertentu, dipisah koma (kosong = semua)"
        required: false
      force:
        description: "Abaikan penjaga sekali-per-hari"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # Versi aksi WAJIB yang berjalan di Node 24. GitHub mengumumkan Node 20
      # dihapus dari runner pada 23/09/2026 (changelog 2025-09-19). checkout@v4,
      # setup-python@v5, dan cache@v4 masih Node 20 — kalau dibiarkan, run
      # harian bisa gagal total dan hari yang hilang tidak bisa dikejar.
      # Isian (fetch-depth, python-version, cache, path, key) tidak berubah.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Sebagian halaman harga hanya memuat angkanya lewat JavaScript.
      # Target tersebut ditandai `render: js` di targets.yaml. Kalau langkah
      # ini dihapus, target itu dilewati dengan status skipped_render —
      # tidak menjatuhkan run, tapi arsipnya bolong.
      - name: Cache browser Playwright
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.62.0

      - name: Pasang Chromium untuk target render=js
        run: |
          pip install playwright==1.62.0
          python -m playwright install --with-deps chromium

      - name: Jalankan pengumpul
        env:
          APT_CONTACT_URL: https://github.com/${{ github.repository }}
        run: |
          python -m collector.run \
            ${{ github.event.inputs.only && format('--only {0}', github.event.inputs.only) || '' }} \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      # Ringkasan hanya menyusun PESAN commit. Ia tidak boleh bisa menggagalkan
      # penyimpanan arsip: tanpa continue-on-error, satu galat di sini membuat
      # langkah "Commit snapshot" dilewati dan seluruh hari itu hilang.
      # Kalau pesannya kosong, push_snapshot.py memakai pesan cadangan.
      - name: Ringkas hasil
        id: sum
        continue-on-error: true
        run: python scripts/summarize_run.py >> "$GITHUB_OUTPUT"

      - name: Commit snapshot
        run: python scripts/push_snapshot.py "${{ steps.sum.outputs.message }}"

      # ---------------------------------------------------------------------
      # Halaman publik. SENGAJA diletakkan SETELAH arsip aman tersimpan, dan
      # SENGAJA memakai continue-on-error: kalau pembangun halaman rusak, itu
      # tidak boleh sampai membuat satu hari arsip hilang. Arsip adalah aset
      # proyek ini; halaman publik hanyalah tampilannya.
      #
      # Skrip ini tidak pernah mengambil apa pun dari internet dan tidak
      # pernah menulis ke data/ — hanya membaca arsip lalu menulis docs/.
      # ---------------------------------------------------------------------
      - name: Bangun & terbitkan halaman publik
        if: always()
        continue-on-error: true
        run: python scripts/build_site.py --commit

      - name: Tulis ringkasan ke halaman run
        if: always()
        run: python scripts/summarize_run.py --markdown >> "$GITHUB_STEP_SUMMARY"
