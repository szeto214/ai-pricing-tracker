name: collect

# Arsipnya hidup dari konsistensi. Setiap hari yang lewat tanpa mengumpulkan
# adalah hari yang hilang permanen — jadi workflow ini sengaja dibuat supaya
# TIDAK pernah gagal total gara-gara sebagian situs error.

on:
  schedule:
    # 02:10 UTC = 09:10 WIB. GitHub sering menunda cron beberapa menit; itu
    # tidak masalah karena kita hanya butuh satu snapshot per hari.
    - cron: "10 2 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Slug tertentu, dipisah koma (kosong = semua)"
        required: false
      force:
        description: "Abaikan penjaga sekali-per-hari"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Jalankan pengumpul
        env:
          APT_CONTACT_URL: https://github.com/${{ github.repository }}
        run: |
          python -m collector.run \
            ${{ github.event.inputs.only && format('--only {0}', github.event.inputs.only) || '' }} \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Ringkas hasil
        id: sum
        run: python scripts/summarize_run.py >> "$GITHUB_OUTPUT"

      - name: Commit snapshot
        run: |
          git config user.name  "pricing-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "tidak ada perubahan berkas — tidak ada commit"
            exit 0
          fi
          git commit -m "${{ steps.sum.outputs.message }}"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push gagal, coba lagi ($i)"; sleep 10
          done
          exit 1

      - name: Tulis ringkasan ke halaman run
        if: always()
        run: python scripts/summarize_run.py --markdown >> "$GITHUB_STEP_SUMMARY"
